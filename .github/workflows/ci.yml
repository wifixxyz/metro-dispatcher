name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # TODO: перейти на `npm ci`, когда в репозиторий будет добавлен package-lock.json
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # Смоук-тест Playwright на мобильном вьюпорте 390×844 (SPEC §10), по собранному dist.
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
